<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reserve your iPhone</title>
<style>
  :root{
    --bg1:#a7cbe0; --bg2:#c6dced;
    --card:#ffffff;
    --ink:#1d1d1f; --muted:#6e6e73;
    --line:#d7dade;
    --green:#2bb24c; --green-d:#1f9c40;
    --blue:#0071e3;
    --gift:#2563eb;
    --radius:24px;
    --shadow:0 10px 30px rgba(30,58,95,.18);
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100dvh; display:flex; justify-content:center;
    padding:22px 16px 40px;
  }
  .app{ width:100%; max-width:480px; }

  /* feed */
  .head{ text-align:center; padding:6px 4px 20px; }
  .brand{ font-size:.85rem; font-weight:600; letter-spacing:.02em; color:#0a3a5c; opacity:.75; }
  .head h1{ font-size:1.9rem; font-weight:700; letter-spacing:-.02em; margin:.35rem 0 .3rem; line-height:1.1; }
  .head p{ margin:0; color:#0a3a5c; opacity:.75; font-size:1rem; }

  .list{ display:flex; flex-direction:column; gap:14px; }
  .model{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    display:flex; align-items:center; gap:14px; padding:16px 18px; cursor:pointer;
    border:1px solid rgba(255,255,255,.6); transition:transform .12s ease;
  }
  .model:active{ transform:scale(.985); }
  .model .thumb{ width:58px; flex:0 0 58px; display:flex; justify-content:center; }
  .model .thumb img{ width:54px; height:auto; display:block; filter:drop-shadow(0 3px 6px rgba(0,0,0,.16)); }
  .model .meta{ flex:1; min-width:0; }
  .model .meta h3{ margin:0; font-size:1.12rem; font-weight:650; letter-spacing:-.01em; }
  .model .meta span{ display:block; color:var(--muted); font-size:.9rem; margin-top:2px; }
  .model .price{ text-align:right; flex:0 0 auto; }
  .model .price b{ font-size:1.05rem; font-weight:650; }
  .model .price small{ display:block; color:var(--muted); font-size:.72rem; }
  .model .chev{ color:#c1c4c9; font-size:1.6rem; line-height:1; margin-left:2px; }

  /* configurator */
  .config{ background:var(--card); border-radius:28px; box-shadow:var(--shadow); overflow:hidden; }
  .cfg-top{ display:flex; align-items:center; gap:10px; padding:14px 16px 4px; }
  .back{ appearance:none; border:none; background:#f1f2f4; color:var(--ink);
    width:38px; height:38px; border-radius:50%; font-size:1.3rem; cursor:pointer; line-height:1; }
  .cfg-top .title{ font-weight:650; font-size:1.02rem; }

  .hero{ text-align:center; padding:8px 0 4px; }
  .hero-stage{ position:relative; display:inline-block; }
  .hero-ph{ width:200px; height:auto; display:block; position:relative; z-index:1;
    filter:drop-shadow(0 16px 20px rgba(0,0,0,.18)); transition:opacity .16s ease; }
  .hero .hero-name{ font-weight:650; font-size:1.15rem; margin-top:6px; }
  .hero .hero-price{ color:var(--muted); font-size:.9rem; margin-top:1px; }

  .section{ padding:16px 20px 0; }
  .section .lbl{ font-size:1.02rem; margin-bottom:12px; }
  .section .lbl b{ font-weight:650; }

  .swatches{ display:flex; gap:14px; flex-wrap:wrap; }
  .swatch{ width:44px; height:44px; border-radius:50%; cursor:pointer; position:relative;
    border:2px solid rgba(0,0,0,.08); box-shadow:inset 0 0 0 3px #fff, 0 1px 3px rgba(0,0,0,.15); }
  .swatch.sel{ outline:2px solid var(--blue); outline-offset:3px; }
  .swatch.sold{ cursor:not-allowed; opacity:.45; }
  .swatch.sold::after{ content:""; position:absolute; inset:-2px; border-radius:50%;
    background:linear-gradient(to top right, transparent 46%, #ff3b30 46%, #ff3b30 54%, transparent 54%); }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .cap{ appearance:none; background:#fff; border:1.5px solid var(--line); border-radius:14px;
    padding:15px 10px; font-size:1.02rem; font-weight:600; color:var(--ink); cursor:pointer; position:relative;
    font-family:inherit; }
  .cap.sel{ border-color:var(--blue); box-shadow:inset 0 0 0 1px var(--blue); }
  .cap.na{ color:#b6b8bd; cursor:not-allowed; border-color:#e5e6e9; background:#fafafb; }
  .cap.na::after{ content:""; position:absolute; inset:0; border-radius:14px;
    background:linear-gradient(to top right, transparent 48.4%, #c8cacd 48.4%, #c8cacd 51.6%, transparent 51.6%); }

  .gift{ margin:20px 20px 0; border:1px solid var(--line); border-radius:18px; padding:14px;
    display:flex; align-items:center; gap:14px; position:relative; }
  .gift .badge{ position:absolute; top:-11px; right:16px; background:var(--gift); color:#fff;
    font-size:.72rem; font-weight:700; letter-spacing:.04em; padding:5px 10px; border-radius:8px; }
  .gift .g-ico{ height:56px; width:auto; flex:0 0 auto; display:block; filter:drop-shadow(0 2px 4px rgba(0,0,0,.14)); }
  .gift .g-txt b{ font-size:1.02rem; font-weight:650; }
  .gift .g-txt span{ display:block; color:var(--gift); font-size:.85rem; margin-top:2px; font-weight:600; }

  .gift.pulse{ border-color:#bcd0f5; animation:giftPulse 1.8s ease-in-out infinite; }
  @keyframes giftPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(37,99,235,0); transform:scale(1); }
    50%{ box-shadow:0 0 0 7px rgba(37,99,235,.12); transform:scale(1.02); }
  }

  /* gift popup */
  .gpop{ position:fixed; inset:0; background:rgba(18,40,60,.5); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; padding:24px; z-index:30; }
  .gpop.on{ display:flex; }
  .gpop-card{ background:#fff; border-radius:24px; padding:28px 24px 22px; width:100%; max-width:320px;
    text-align:center; position:relative; box-shadow:0 24px 60px rgba(0,0,0,.32);
    transform:translateY(28px) scale(.9); opacity:0;
    transition:transform .5s cubic-bezier(.2,.9,.3,1.35), opacity .35s ease; }
  .gpop.show .gpop-card{ transform:none; opacity:1; }
  .gpop-card .badge{ position:absolute; top:-11px; left:50%; transform:translateX(-50%);
    background:var(--gift); color:#fff; font-size:.72rem; font-weight:700; letter-spacing:.04em; padding:5px 12px; border-radius:8px; }
  .gpop-img{ height:118px; width:auto; display:block; margin:10px auto 12px; filter:drop-shadow(0 6px 12px rgba(0,0,0,.16)); }
  .gpop-title{ font-size:1.25rem; font-weight:700; letter-spacing:-.01em; }
  .gpop-sub{ color:var(--muted); font-size:.95rem; margin-top:3px; }
  .gpop-ok{ margin-top:20px; width:100%; border:none; border-radius:14px; background:var(--blue); color:#fff;
    font-family:inherit; font-weight:700; font-size:1.1rem; padding:15px; cursor:pointer; letter-spacing:.02em;
    transition:transform .1s; }
  .gpop-ok:active{ transform:scale(.985); }

  .cta{ margin:20px; }
  .continue{ width:100%; appearance:none; border:none; border-radius:16px; cursor:pointer;
    background:var(--green); color:#fff; font-family:inherit; font-size:1.25rem; font-weight:800;
    letter-spacing:.08em; padding:18px; box-shadow:0 8px 18px rgba(43,178,76,.35); transition:transform .1s, background .15s; }
  .continue:active{ transform:scale(.985); background:var(--green-d); }

  /* packing */
  .overlay{ position:fixed; inset:0; background:rgba(18,40,60,.55); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:20; }
  .overlay.on{ display:flex; }
  .sheet{ background:#fff; border-radius:26px; width:auto; max-width:90vw; padding:30px 34px;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3); }

  .stage{ position:relative; width:200px; height:196px; margin:0 auto; }
  .drop{ position:absolute; left:50%; top:-10px; width:82px; transform:translate(-50%,-38px) rotate(-8deg); z-index:2; }
  .drop img{ width:100%; height:auto; display:block; filter:drop-shadow(0 8px 10px rgba(0,0,0,.2)); }
  .stage.go .drop{ transform:translate(-50%,44px) rotate(0deg) scale(.9); transition:transform .8s cubic-bezier(.5,.05,.3,1); }

  .box{ position:absolute; left:50%; bottom:6px; transform:translateX(-50%); width:150px; height:104px; }
  .box .inside{ position:absolute; left:8px; right:8px; top:8px; height:34px; background:#6d4a24; border-radius:4px; z-index:1;}
  .box .front{ position:absolute; inset:auto 0 0 0; height:88px; background:linear-gradient(#cf9a5b,#b97f3f);
    border-radius:6px 6px 8px 8px; box-shadow:inset 0 -6px 14px rgba(0,0,0,.18); z-index:2; }
  .box .flap{ position:absolute; top:8px; width:76px; height:26px; background:linear-gradient(#e0b579,#cf9a5b);
    border:1px solid rgba(0,0,0,.06); z-index:3; }
  .box .fl-l{ left:-1px; transform-origin:right center; transform:rotate(-118deg); border-radius:5px 0 0 5px; }
  .box .fl-r{ right:-1px; transform-origin:left center; transform:rotate(118deg); border-radius:0 5px 5px 0; }
  .stage.close .fl-l{ transform:rotate(-8deg); transition:transform .5s ease; }
  .stage.close .fl-r{ transform:rotate(8deg); transition:transform .5s ease; }
  .box .tape{ position:absolute; top:18px; left:50%; width:0; height:9px; background:#e9d9be;
    transform:translateX(-50%); border-radius:2px; z-index:4; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  .stage.tape .tape{ width:150px; transition:width .4s ease; }

  .check{ width:88px; height:88px; margin:0 auto; border-radius:50%; background:var(--green);
    display:flex; align-items:center; justify-content:center; transform:scale(0);
    box-shadow:0 10px 26px rgba(43,178,76,.45); }
  .check.pop{ transform:scale(1); transition:transform .45s cubic-bezier(.2,1.5,.4,1); }
  .check svg{ width:48px; height:48px; }

  .sheet h2{ font-size:1.4rem; font-weight:750; margin:6px 0 4px; letter-spacing:-.01em; }
  .sheet .sum{ color:var(--muted); font-size:1rem; margin:0 0 4px; }
  .sheet .hold{ color:var(--green-d); font-weight:650; font-size:.95rem; margin:2px 0 18px; }
  .sheet .done{ width:100%; border:none; border-radius:14px; background:#f1f2f4; color:var(--ink);
    font-family:inherit; font-weight:650; font-size:1.05rem; padding:15px; cursor:pointer; }

  .hidden{ display:none !important; }
  #confetti{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40; }
  @media (prefers-reduced-motion: reduce){
    .stage.go .drop,.stage.close .fl-l,.stage.close .fl-r,.stage.tape .tape,.check.pop{ transition:none !important; }
  }
</style>
</head>
<body>
  <div class="app">
    <section id="feed">
      <div class="head">
        <div class="brand">iStore · official reseller</div>
        <h1>Choose your new iPhone</h1>
        <p>In stock now. Free MagSafe Case with every order.</p>
      </div>
      <div class="list" id="list"></div>
    </section>
    <section id="configurator" class="hidden"></section>
  </div>

  <div class="overlay" id="overlay"><canvas id="confetti"></canvas><div class="sheet" id="sheet"></div></div>
  <div class="gpop" id="giftpop"><div class="gpop-card" id="gpopCard"></div></div>

const GIFT = { name:"MagSafe Case", note:"Included as a gift" };

const C = {
  orange:{ name:"Cosmic Orange", body:"#e2893a", img:IMG_ORANGE },

const MODELS = [
  {

/* ===== app ===== */
let cur = { model:0, color:0, storage:0, giftShown:false };
let openToken=0;
const $ = s => document.querySelector(s);
const money = n => "$" + n.toLocaleString("en-US");

function renderFeed(){
  $("#list").innerHTML = MODELS.map((m,i)=>{
    const c = m.colors.find(x=>!x.sold) || m.colors[0];
    return `<div class="model" data-m="${i}">
      <div class="thumb"><img src="${c.img}" alt=""></div>
      <div class="meta"><h3>${m.name}</h3><span>${m.tagline}</span></div>
      <div class="chev">›</div>
    </div>`;
  }).join("");
  document.querySelectorAll(".model").forEach(el=>el.addEventListener("click",()=>openModel(+el.dataset.m)));
}
document.getElementById("overlay").addEventListener("click", closePacking);
document.getElementById("giftpop").addEventListener("click", e=>{ if(e.target.id==="giftpop") closeGiftPop(); });

function openModel(i){
  cur.model=i; const m=MODELS[i];
  cur.color=m.colors.findIndex(c=>!c.sold); if(cur.color<0)cur.color=0;
  cur.storage=m.storage.findIndex(s=>s.available); if(cur.storage<0)cur.storage=0;
  $("#feed").classList.add("hidden");
  $("#configurator").classList.remove("hidden");
  cur.giftShown=false;
  renderConfig(); window.scrollTo({top:0});
  const my=++openToken;
  setTimeout(()=>{ if(my===openToken && !$("#configurator").classList.contains("hidden")) showGiftPop(); }, 800);
}

function renderConfig(){
  const m=MODELS[cur.model], color=m.colors[cur.color];
  const swatches=m.colors.map((c,i)=>`<div class="swatch ${i===cur.color?'sel':''} ${c.sold?'sold':''}"
      style="background:${c.body}" data-c="${i}" title="${c.name}${c.sold?' — sold out':''}"></div>`).join("");
  const caps=m.storage.map((s,i)=>`<button class="cap ${i===cur.storage?'sel':''} ${s.available?'':'na'}"
      data-s="${i}" ${s.available?'':'disabled'}>${s.label}</button>`).join("");

  $("#configurator").innerHTML=`
    <div class="config">
      <div class="cfg-top">
        <button class="back" id="back" aria-label="Back">‹</button>
        <div class="title">${m.name}</div>
      </div>
      <div class="hero">
        <div class="hero-stage"><img class="hero-ph" src="${color.img}" alt="${m.name} ${color.name}"></div>
        <div class="hero-name">${m.name}</div>
      </div>
      <div class="section">
        <div class="lbl">Color: <b>${color.name}</b></div>
        <div class="swatches">${swatches}</div>
      </div>
      <div class="section">
        <div class="lbl">Built-in memory: <b>${m.storage[cur.storage].label}</b></div>
        <div class="grid">${caps}</div>
      </div>
      ${cur.giftShown ? `<div class="gift pulse" id="gift">
        <span class="badge">FREE GIFT</span>
        <img class="g-ico" src="${IMG_CASE}" alt="${GIFT.name}">
        <div class="g-txt"><b>${GIFT.name}</b><span>${GIFT.note}</span></div>
      </div>` : ``}
      <div class="cta"><button class="continue" id="continue">CONTINUE</button></div>
    </div>`;

  $("#back").addEventListener("click", backToFeed);
  $("#continue").addEventListener("click", startPacking);
  document.querySelectorAll(".swatch").forEach(el=>el.addEventListener("click",()=>{
    const i=+el.dataset.c; if(m.colors[i].sold) return; cur.color=i; renderConfig();
  }));
  document.querySelectorAll(".cap").forEach(el=>el.addEventListener("click",()=>{
    const i=+el.dataset.s; if(!m.storage[i].available) return; cur.storage=i; renderConfig();
  }));
}

function backToFeed(){ $("#configurator").classList.add("hidden"); $("#feed").classList.remove("hidden"); }

function showGiftPop(){
  const card=$("#gpopCard");
  card.innerHTML=`
    <span class="badge">FREE GIFT</span>
    <img class="gpop-img" src="${IMG_CASE}" alt="${GIFT.name}">
    <div class="gpop-title">${GIFT.name}</div>
    <div class="gpop-sub">Included free with your order</div>
    <button class="gpop-ok" id="gpopOk">OK</button>`;
  $("#gpopOk").addEventListener("click", closeGiftPop);
  const pop=$("#giftpop"); pop.classList.add("on");
  requestAnimationFrame(()=>requestAnimationFrame(()=>pop.classList.add("show")));
}
function closeGiftPop(){
  const pop=$("#giftpop"); pop.classList.remove("show");
  setTimeout(()=>pop.classList.remove("on"), 350);
  cur.giftShown=true; renderConfig();
}

function giftSVG(){
  return `<svg class="g-ico" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="24" y="14" width="52" height="72" rx="14" fill="#eef0f2" stroke="#d3d6da" stroke-width="2"/>
    <rect x="34" y="24" width="30" height="30" rx="9" fill="#f6f7f8" stroke="#d3d6da" stroke-width="2"/>
    <circle cx="44" cy="34" r="4.2" fill="#cfd3d8"/><circle cx="54" cy="34" r="4.2" fill="#cfd3d8"/><circle cx="49" cy="44" r="4.2" fill="#cfd3d8"/>
  </svg>`;
}

/* packing */
function startPacking(){
  const m=MODELS[cur.model], color=m.colors[cur.color], st=m.storage[cur.storage];
  $("#sheet").innerHTML=`
    <div class="stage" id="stage">
      <div class="box">
        <div class="inside"></div><div class="front"></div>
        <div class="flap fl-l"></div><div class="flap fl-r"></div><div class="tape"></div>
      </div>
      <div class="drop"><img src="${color.img}" alt=""></div>
    </div>
    <div class="check hidden" id="check">
      <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>`;
  $("#overlay").classList.add("on");
  const stage=$("#stage");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step=(fn,ms)=>setTimeout(fn, reduce?0:ms);
  step(()=>stage.classList.add("go"),80);
  step(()=>stage.classList.add("close"),900);
  step(()=>stage.classList.add("tape"),1450);
  step(()=>{
    stage.classList.add("hidden");
    const chk=$("#check"); chk.classList.remove("hidden");
    requestAnimationFrame(()=>chk.classList.add("pop"));
    fireConfetti();
    clearTimeout(autoClose); autoClose=setTimeout(closePacking, 4500);
  }, reduce?120:2000);
}

let timer=null, autoClose=null;
function startCountdown(){
  let t=15*60; const el=$("#hold"); clearInterval(timer);
  timer=setInterval(()=>{
    t--; if(t<0){clearInterval(timer);return;}
    const mm=String(Math.floor(t/60)).padStart(2,"0"), ss=String(t%60).padStart(2,"0");
    if(el) el.textContent=`Held for you · ${mm}:${ss}`;
  },1000);
}
function closePacking(){ clearInterval(timer); clearTimeout(autoClose); const cv=document.getElementById("confetti"); if(cv)cv.getContext("2d").clearRect(0,0,cv.width,cv.height); $("#overlay").classList.remove("on"); backToFeed(); }

function fireConfetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const canvas=document.getElementById("confetti");
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr; canvas.height=innerHeight*dpr;
  canvas.style.width=innerWidth+"px"; canvas.style.height=innerHeight+"px";
  const ctx=canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  const r=document.getElementById("check").getBoundingClientRect();
  const ox=r.left+r.width/2, oy=r.top+r.height/2;
  const colors=["#ff5a3c","#ffb03a","#2bb24c","#0071e3","#b49bd8","#ec4d95","#ffd447","#12c2c2"];
  const P=[]; const N=190;
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, sp=4+Math.random()*9;
    P.push({ x:ox, y:oy,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-(4+Math.random()*5),
      g:0.16+Math.random()*0.14, s:5+Math.random()*7,
      rot:Math.random()*6.28, vr:-0.35+Math.random()*0.7,
      col:colors[i%colors.length], rect:Math.random()<0.55,
      life:0, ttl:110+Math.random()*50, drag:0.986 });
  }
  let frame=0;
  (function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    let alive=false;
    for(const p of P){
      if(p.life++>p.ttl) continue; alive=true;
      p.vx*=p.drag; p.vy=p.vy*p.drag+p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.ttl);
      ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.col;
      if(p.rect) ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);
      else { ctx.beginPath(); ctx.arc(0,0,p.s/2,0,6.29); ctx.fill(); }
      ctx.restore();
    }
    if(alive && frame++<240) requestAnimationFrame(tick);
    else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

renderFeed();
</script>
</body>
</html>
